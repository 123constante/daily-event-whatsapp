name: Daily Event WhatsApp

on:
  schedule:
    - cron: '0 8 * * *'  # 8 AM UTC daily
      workflow_dispatch:

jobs:
  send_daily_events:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Edge Function
        run: |
          curl -X POST \
            https://stdactfauprzddbmzg.supabase.co/functions/v1/send_daily_whatsapp \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "whatsapp_token": "${{ secrets.WHATSAPP_ACCESS_TOKEN }}",
              "phone_number_id": "${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}",
              "recipient_phone": "${{ secrets.WHATSAPP_RECIPIENT_PHONE }}"
            }'
